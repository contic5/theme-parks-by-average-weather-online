<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>theme-parks-by-average-weather-online</title>
  </head>
  <body>
  <main>
  <h1>Theme Parks by Average Weather</h1>
  <form>
  <label for="target_park">Target Park</label>
  <select id="target_park"></select>

  <label for="heat_measure">Heat Measure</label>
  <select id="heat_measure">
  <option value="temperature_2m_max">Maximum Temperature</option>
  <option value="temperature_2m_mean" selected>Average Temperature</option>
  <option value="temperature_2m_min">Minimum Temperature</option>
  </select>

  <label for="humidity_measure">Humidity Measure</label>
  <select id="humidity_measure">
  <option value="relative_humidity_2m_max">Maximum Humidity</option>
  <option value="relative_humidity_2m_mean" selected>Average Humidity</option>
  <option value="relative_humidity_2m_min">Minimum Humidity</option>
  </select>
  </form>
  <div id="results">
  
  </div>
  </main>
  <script src="src/main.ts" type="module"></script>
  <script type="module">
  import {update_values} from "/src/main.ts";
  let heat_measure_element=document.getElementById("heat_measure");
  let humidity_measure_element=document.getElementById("humidity_measure");

  heat_measure_element.onchange=update_values;
  humidity_measure_element.onchange=update_values;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
